modLoader="javafml"
loaderVersion="${loader_version_range}"
license="GPLv3"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Optional AppleSkin integration (food-value tooltip/HUD compatibility).
[[dependencies.${mod_id}]]
modId="appleskin"
mandatory=false
versionRange="[2.5.1+mc1.20.1,)"
ordering="NONE"
side="CLIENT"
