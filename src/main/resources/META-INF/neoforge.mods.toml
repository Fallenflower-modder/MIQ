license="GPLv3"

[[mods]]
modId="miq"
version="1.0.0-1.21.1"
displayName="Most Important Question"
authors="Clovers_Echo"
description='''What's to eat today?'''

[[mixins]]
config="miq.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Optional AppleSkin integration (food-value tooltip/HUD compatibility).
[[dependencies.${mod_id}]]
modId="appleskin"
type="optional"
ordering="NONE"
side="CLIENT"

# Optional Some Assembly Required integration (sandwich whole-desire tooltip/eat compatibility).
# Present on both sides so dedicated servers + clients agree on sandwich desire/lore.
[[dependencies.${mod_id}]]
modId="someassemblyrequired"
type="optional"
ordering="NONE"
side="BOTH"